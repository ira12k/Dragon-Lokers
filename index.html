<style>
  :root{
    --bg: #12151a;
    --bg-soft: #171b21;
    --panel: #1e232b;
    --panel-2: #242a33;
    --line: #2e3542;
    --line-soft: #262c36;
    --text: #e7ebf1;
    --muted: #8a93a3;
    --muted-2: #5c6474;
    --accent: #f5c518;
    --accent-dim: #a88a1a;
    --teal: #2dd4bf;
    --ok: #45c774;
    --ok-dim: rgba(69,199,116,0.14);
    --warn: #f5b942;
    --warn-dim: rgba(245,185,66,0.14);
    --full: #ef5b5b;
    --full-dim: rgba(239,91,91,0.14);
    --radius: 10px;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(245,197,24,0.06), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(45,212,191,0.05), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
  }
  .mono{ font-family: 'JetBrains Mono', monospace; }
  .display{ font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.03em; }

  /* ---------- Layout shells ---------- */
  .view{ display:none; }
  .view.active{ display:block; }

  /* ---------- HOME ---------- */
  #home{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 48px 20px;
    text-align:center;
  }
  .brand-eyebrow{
    color: var(--accent);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .brand-title{
    font-family:'Bebas Neue',sans-serif;
    font-size: clamp(48px, 9vw, 96px);
    line-height: 0.95;
    letter-spacing: 0.02em;
    margin:0;
    background: linear-gradient(180deg, #ffffff 10%, #b9c2d0 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .brand-sub{
    font-family:'Bebas Neue',sans-serif;
    font-size: clamp(20px, 3.4vw, 32px);
    color: var(--accent);
    margin: 2px 0 40px;
    letter-spacing: 0.08em;
  }
  .home-grid{
    display:grid;
    grid-template-columns: repeat(3, minmax(220px, 300px));
    gap: 20px;
    width:100%;
    max-width: 1000px;
  }
  @media (max-width: 800px){
    .home-grid{ grid-template-columns: 1fr; }
  }
  .section-card{
    position:relative;
    background: linear-gradient(180deg, var(--panel), var(--bg-soft));
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 26px 22px 22px;
    text-align:left;
    cursor:pointer;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    overflow:hidden;
  }
  .section-card::before{
    content:"";
    position:absolute; inset:0 0 auto 0; height:4px;
    background: linear-gradient(90deg, var(--accent), var(--teal));
    opacity:0.85;
  }
  .section-card:hover{
    transform: translateY(-4px);
    border-color: var(--accent-dim);
    box-shadow: var(--shadow);
  }
  .section-card .num{
    font-family:'JetBrains Mono',monospace;
    color: var(--muted-2);
    font-size: 12px;
    letter-spacing: 0.2em;
  }
  .section-card h3{
    font-family:'Bebas Neue',sans-serif;
    font-size: 30px;
    letter-spacing: 0.02em;
    margin: 6px 0 14px;
  }
  .card-stats{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top: 4px;
  }
  .chip{
    font-family:'JetBrains Mono',monospace;
    font-size: 11px;
    padding: 5px 9px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--muted);
    white-space:nowrap;

  .chip.ok{ color: var(--ok); border-color: rgba(69,199,116,0.35); background: var(--ok-dim); }
  .chip.warn{ color: var(--warn); border-color: rgba(245,185,66,0.35); background: var(--warn-dim); }
  .chip.full{ color: var(--full); border-color: rgba(239,91,91,0.35); background: var(--full-dim); }

  .filter-tab[data-f="partial"] .dot{ background: var(--warn); }

  .locker-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
    gap: 10px;
  }
  .locker-tile{
    position:relative;
    background: repeating-linear-gradient(180deg, var(--panel) 0px, var(--panel) 3px, var(--panel-2) 3px, var(--panel-2) 4px);
    border: 1px solid var(--line);
    border-left: 4px solid var(--muted-2);
    border-radius: 8px;
    padding: 10px 11px 9px;
    cursor: pointer;
    transition: transform .1s ease, border-color .12s ease;
    min-height: 96px;
    display:flex; flex-direction:column; gap:6px;
  }
  .locker-tile:hover{ transform: translateY(-2px); border-color: var(--accent-dim); }
  .locker-tile.dim{ opacity: 0.22; pointer-events:none; }
  .locker-tile.match{ box-shadow: 0 0 0 2px var(--accent); }
  .locker-tile.empty{ border-left-color: var(--ok); }
  .locker-tile.partial{ border-left-color: var(--warn); }
  .locker-tile.full{ border-left-color: var(--full); }

  .tile-top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .tile-num{ font-family:'Bebas Neue',sans-serif; font-size:20px; color: var(--text); line-height:1; }
  .tile-lock{ font-size: 13px; opacity:0.8; }
  .tile-slot{

    color: var(--muted);
    border-top: 1px dashed var(--line-soft);
    padding-top: 4px;

  .tile-slot .who{ color: var(--text); font-weight:600; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tile-slot .pos{ color: var(--muted); display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:10.5px; }
  .tile-slot.vacant{ color: var(--muted-2); font-style:italic; }

  .empty-state{
    text-align:center; padding: 60px 20px; color: var(--muted);
    font-family:'JetBrains Mono',monospace; font-size:13px;
  }

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed; inset:0; background: rgba(6,8,11,0.72);

  .modal{

  .modal-body{ padding: 18px 22px 22px; display:flex; flex-direction:column; gap:16px; }

    background: var(--panel);

    padding: 14px 16px;

    font-size: 11px;
    text-transform:uppercase;

  .field{ margin-bottom: 10px; }
  .field label{ display:block; font-size:11.5px; color: var(--muted); margin-bottom:5px; }
  .field input{
    width:100%;
    background: var(--bg-soft);
    border: 1px solid var(--line);

  .toast{

    background: var(--panel-2); border:1px solid var(--accent-dim);
    color: var(--text); padding: 11px 18px; border-radius: 9px;
    font-size: 13px; z-index: 200; box-shadow: var(--shadow);
    opacity:0; pointer-events:none; transition: opacity .2s ease;
  }
  .toast.show{ opacity:1; }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius:6px; }
  ::-webkit-scrollbar-track{ background: transparent; }

  /* ---------- PASSWORD GATE ---------- */
  #passwordGate{
    position: fixed; inset:0; z-index: 500;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(245,197,24,0.07), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(45,212,191,0.06), transparent 55%),

    display:flex; align-items:center; justify-content:center;

  #passwordGate.hidden{ display:none; }
  .gate-card{
    width:100%; max-width: 360px;
    background: linear-gradient(180deg, var(--panel), var(--bg-soft));

    border-radius: 14px;
    padding: 30px 28px 26px;
    text-align:center;
    box-shadow: var(--shadow);

  .gate-lock{ font-size: 30px; margin-bottom: 6px; }
  .gate-card .brand-eyebrow{ margin-bottom: 6px; }
  .gate-card h2{
    font-family:'Bebas Neue',sans-serif;

  .gate-card p{ color: var(--muted); font-size: 12.5px; margin: 0 0 20px; }
  .gate-card input{
    width:100%;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 11px 12px;
    border-radius: 8px;
    font-size: 14px;

    letter-spacing: 0.05em;

  .gate-card input:focus{ outline:none; border-color: var(--accent-dim); }
  .gate-card .btn{ width:100%; justify-content:center; padding: 11px; }
  .gate-error{
    color: var(--full); font-size: 12px; margin-top: 10px;
    min-height: 14px; font-family:'JetBrains Mono',monospace;
  }
  #appRoot{ display:none; }
</style>
</head>
<body>

<!-- ============ PASSWORD GATE ============ -->
<div id="passwordGate">
  <div class="gate-card">
    <div class="gate-lock">🔒</div>
    <div class="brand-eyebrow">Драгон Парк Антей</div>
    <h2>Доступ до локерів</h2>
    <p>Введіть пароль, щоб продовжити</p>
    <input type="password" id="gatePassword" placeholder="Пароль" autocomplete="current-password">
    <button class="btn primary" id="gateSubmit" type="button">Увійти</button>
    <div class="gate-error" id="gateError"></div>
  </div>
</div>

<script>
// Пароль для входу на сайт (клієнтський захист від випадкових відвідувачів)
const SITE_PASSWORD = "dragon2828";
const GATE_STORAGE_KEY = "dragon-park-gate-ok";

function checkGate(){
  const input = document.getElementById('gatePassword');
  const val = input.value;
  if(val === SITE_PASSWORD){
    try{ localStorage.setItem(GATE_STORAGE_KEY, "1"); }catch(e){}
    document.getElementById('passwordGate').classList.add('hidden');
    document.getElementById('appRoot').style.display = 'block';
  } else {
    document.getElementById('gateError').textContent = 'Невірний пароль. Спробуйте ще раз.';
    input.value = '';
    input.focus();
  }
}

document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('gateSubmit').addEventListener('click', checkGate);
  document.getElementById('gatePassword').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') checkGate();
    document.getElementById('gateError').textContent = '';
  });

  let alreadyOk = false;
  try{ alreadyOk = localStorage.getItem(GATE_STORAGE_KEY) === "1"; }catch(e){}
  if(alreadyOk){
    document.getElementById('passwordGate').classList.add('hidden');
    document.getElementById('appRoot').style.display = 'block';
  } else {
    document.getElementById('gatePassword').focus();
  }
});
</script>

<script>
/* =========================================================

const firebaseConfig = {
  apiKey: "AIzaSyDspb638Pff23kCoiIunH-v9PbFARM0uI4",
  authDomain: "dragon-lokers.firebaseapp.com",
  projectId: "dragon-lokers",
  storageBucket: "dragon-lokers.firebasestorage.app",
  messagingSenderId: "772218755537",
  appId: "1:772218755537:web:dcba303481f452c15a68f0"
};

const FIREBASE_READY = firebaseConfig.apiKey !== "ВСТАВТЕ_СЮДИ";
let db = null;
let docRef = null;
if(FIREBASE_READY){
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  docRef = db.collection('dragonpark').doc('lockers-data');
}

const LOCAL_FALLBACK_KEY = 'dragon-park-lockers-data-v1'; // used only if Firebase isn't configured yet

const LOCKERS_PER_SECTION = 84;
const SECTIONS = [
  { id: 'floor2',    label: 'Роздягалка 2 поверх' },
  { id: 'kitchen',   label: 'Роздягалка Кухні' },
  { id: 'operators', label: 'Роздягалка Операторів' },
];

let DATA = null;
let currentSection = null;
let currentFilter = 'all';
let currentLockerNum = null;
let suppressNextSnapshot = false;

// ---------- Data helpers ----------
function makeDefaultData(){
  const d = {};
  SECTIONS.forEach(s => {
    d[s.id] = [];
    for(let i=1;i<=LOCKERS_PER_SECTION;i++){
      d[s.id].push({
        num: i,
        slots: [
          { posada:'', name:'', date:'' },
          { posada:'', name:'', date:'' }
        ]
      });
    }
  });
  return d;
}

function healData(parsed){
  SECTIONS.forEach(s=>{
    if(!parsed[s.id]) parsed[s.id] = makeDefaultData()[s.id];
  });
  return parsed;
}

async function loadData(){
  if(!FIREBASE_READY){
    showToast('⚠ Firebase не налаштовано — дані зберігаються лише локально в цьому браузері');
    try{
      const raw = localStorage.getItem(LOCAL_FALLBACK_KEY);
      DATA = raw ? healData(JSON.parse(raw)) : makeDefaultData();
    }catch(e){
      DATA = makeDefaultData();
    }
    return;
  }

  try{
    const snap = await docRef.get();
    if(snap.exists && snap.data().json){
      DATA = healData(JSON.parse(snap.data().json));
    } else {
      DATA = makeDefaultData();
      await saveData();
    }
  }catch(e){
    console.error('Firestore load failed', e);
    showToast('⚠ Не вдалося завантажити дані з бази');
    DATA = makeDefaultData();
  }

  // Live sync: якщо хтось інший вносить зміни, оновлюємо екран автоматично
  docRef.onSnapshot((snap) => {
    if(suppressNextSnapshot){ suppressNextSnapshot = false; return; }
    if(!snap.exists) return;
    const overlayOpen = document.getElementById('overlay').classList.contains('active');
    if(overlayOpen) return; // не перебиваємо людину, поки вона редагує локер
    try{
      DATA = healData(JSON.parse(snap.data().json));
      if(document.getElementById('home').classList.contains('active')){
        renderHome();
      } else if(currentSection){
        renderSection();
      }
    }catch(e){ console.error('Snapshot parse failed', e); }
  });
}

async function saveData(){
  if(!FIREBASE_READY){
    try{
      localStorage.setItem(LOCAL_FALLBACK_KEY, JSON.stringify(DATA));
    }catch(e){
      console.error('Local save failed', e);
      showToast('⚠ Помилка збереження даних');
    }
    return;
  }
  try{
    suppressNextSnapshot = true;
    await docRef.set({ json: JSON.stringify(DATA), updatedAt: Date.now() });
  }catch(e){
    console.error('Firestore save failed', e);
    showToast('⚠ Помилка збереження даних у базу');
  }
}

function lockerStatus(locker){
  const filled = locker.slots.filter(s => s.name && s.name.trim() !== '').length;
  if(filled === 0) return 'empty';
  if(filled === 2) return 'full';
  return 'partial';
}

function monthsSince(dateStr){
  if(!dateStr) return null;
  const then = new Date(dateStr);
  if(isNaN(then)) return null;
  const now = new Date();
  let months = (now.getFullYear()-then.getFullYear())*12 + (now.getMonth()-then.getMonth());
  if(now.getDate() < then.getDate()) months -= 1;
  return Math.max(0, months);
}

function sectionStats(sectionId){
  const lockers = DATA[sectionId];
  let empty=0, partial=0, full=0;
  lockers.forEach(l=>{
    const st = lockerStatus(l);
    if(st==='empty') empty++; else if(st==='full') full++; else partial++;
  });
  return {empty, partial, full, total: lockers.length};
}

// ---------- Rendering: Home ----------
function renderHome(){
  const grid = document.getElementById('homeGrid');
  grid.innerHTML = '';
  SECTIONS.forEach((s, idx) => {
    const stats = sectionStats(s.id);
    const card = document.createElement('div');
    card.className = 'section-card';
    card.innerHTML = `
      <div class="num">0${idx+1} / ЛОКЕРНА</div>
      <h3>${s.label}</h3>
      <div class="card-stats">
        <span class="chip ok">Порожні ${stats.empty}</span>
        <span class="chip warn">Частково ${stats.partial}</span>
        <span class="chip full">Повні ${stats.full}</span>
      </div>
    `;
    card.addEventListener('click', () => openSection(s.id));
    grid.appendChild(card);
  });
}

// ---------- Rendering: Section ----------
function openSection(sectionId){
  currentSection = sectionId;
  currentFilter = 'all';
  document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector('.filter-tab[data-f="all"]').classList.add('active');
  document.getElementById('searchInput').value = '';
  showView('sectionView');
  renderSection();
}

function showView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  forceScrollTop();
}

function forceScrollTop(){
  window.scrollTo(0,0);
  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;
  requestAnimationFrame(() => {
    window.scrollTo(0,0);
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
  });
}

function renderSection(){
  const meta = SECTIONS.find(s=>s.id===currentSection);
  document.getElementById('secTitle').textContent = meta.label;
  const stats = sectionStats(currentSection);
  document.getElementById('secCount').textContent =
    `${stats.total} локерів · порожні ${stats.empty} · частково ${stats.partial} · повні ${stats.full}`;
  renderGrid();
}

function renderGrid(){
  const grid = document.getElementById('lockerGrid');
  const emptyState = document.getElementById('emptyState');
  grid.innerHTML = '';
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const lockers = DATA[currentSection];
  let visibleCount = 0;

  lockers.forEach(locker => {
    const status = lockerStatus(locker);
    let matchesFilter = currentFilter === 'all' || currentFilter === status;

    let matchesSearch = true;
    let isSearchHit = false;
    if(query){
      const numMatch = String(locker.num).includes(query);
      const slotMatch = locker.slots.some(s =>
        (s.posada && s.posada.toLowerCase().includes(query)) ||
        (s.name && s.name.toLowerCase().includes(query))
      );
      matchesSearch = numMatch || slotMatch;
      isSearchHit = matchesSearch;
    }

    const tile = document.createElement('div');
    tile.className = `locker-tile ${status}`;
    if(!matchesFilter || !matchesSearch){
      tile.classList.add('dim');
    } else {
      visibleCount++;
    }
    if(query && isSearchHit) tile.classList.add('match');

    const lockIcon = status === 'full' ? '🔒' : status === 'empty' ? '🔓' : '🔐';

    const slotsHtml = locker.slots.map((s, i) => {
      if(s.name && s.name.trim()!==''){
        const m = monthsSince(s.date);
        const durTxt = m===null ? '' : (m<1 ? 'менше місяця' : `${m} міс.`);
        return `<div class="tile-slot">
          <span class="who">${escapeHtml(s.name)}</span>
          <span class="pos">${escapeHtml(s.posada || '—')}${durTxt ? ' · '+durTxt : ''}</span>
        </div>`;
      }
      return `<div class="tile-slot vacant">Місце ${i+1}: вільно</div>`;
    }).join('');

    tile.innerHTML = `
      <div class="tile-top">
        <div class="tile-num">№${locker.num}</div>
        <div class="tile-lock">${lockIcon}</div>
      </div>
      ${slotsHtml}
    `;
    tile.addEventListener('click', () => openModal(locker.num));
    grid.appendChild(tile);
  });

  emptyState.style.display = visibleCount === 0 ? 'block' : 'none';
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ---------- Modal ----------
function openModal(num){
  currentLockerNum = num;
  const locker = DATA[currentSection].find(l => l.num === num);
  const meta = SECTIONS.find(s=>s.id===currentSection);

  document.getElementById('modalTitle').textContent = `Локер №${num}`;
  document.getElementById('modalSub').textContent = meta.label;

  const body = document.getElementById('modalBody');
  body.innerHTML = '';

  locker.slots.forEach((slot, i) => {
    const m = monthsSince(slot.date);
    const durTxt = (slot.name && m!==null) ? (m<1 ? 'Заселено менше місяця тому' : `Заселено ${m} міс. тому`) : '';
    const card = document.createElement('div');
    card.className = 'slot-card';
    card.innerHTML = `
      <h4>Місце ${i+1}
        <button class="btn ghost small" data-clear-slot="${i}" type="button">Очистити</button>
      </h4>
      <div class="field">
        <label>Посада</label>
        <input type="text" list="posadaList" data-slot="${i}" data-field="posada" value="${escapeHtml(slot.posada||'')}" placeholder="Напр. Оператор атракціону">
      </div>
      <div class="field">
        <label>Прізвище Ім'я</label>
        <input type="text" data-slot="${i}" data-field="name" value="${escapeHtml(slot.name||'')}" placeholder="Прізвище Ім'я">
      </div>
      <div class="field">
        <label>Дата заселення</label>
        <input type="date" data-slot="${i}" data-field="date" value="${slot.date||''}">
        <div class="duration">${durTxt}</div>
      </div>
    `;
    body.appendChild(card);
  });

  body.querySelectorAll('[data-clear-slot]').forEach(btn=>{
    btn.addEventListener('click', () => {
      const idx = Number(btn.getAttribute('data-clear-slot'));
      const inputs = body.querySelectorAll(`[data-slot="${idx}"]`);
      inputs.forEach(inp => inp.value = '');
    });
  });

  document.getElementById('overlay').classList.add('active');
}

function closeModal(){
  document.getElementById('overlay').classList.remove('active');
  currentLockerNum = null;
}

async function saveModal(){
  const locker = DATA[currentSection].find(l => l.num === currentLockerNum);
  const body = document.getElementById('modalBody');
  [0,1].forEach(i=>{
    const posada = body.querySelector(`[data-slot="${i}"][data-field="posada"]`).value.trim();
    const name = body.querySelector(`[data-slot="${i}"][data-field="name"]`).value.trim();
    const date = body.querySelector(`[data-slot="${i}"][data-field="date"]`).value;
    locker.slots[i] = { posada, name, date: name ? date : '' };
  });
  await saveData();
  closeModal();
  renderSection();
  showToast('✓ Локер №' + currentLockerNumBackup + ' збережено');
}

let currentLockerNumBackup = null;

async function clearLocker(){
  if(!confirm(`Очистити обидва місця в локері №${currentLockerNum}?`)) return;
  const locker = DATA[currentSection].find(l => l.num === currentLockerNum);
  locker.slots = [ {posada:'',name:'',date:''}, {posada:'',name:'',date:''} ];
  await saveData();
  closeModal();
  renderSection();
  showToast('Локер очищено');
}

// ---------- Export to Excel ----------
function exportExcel(){
  const wb = XLSX.utils.book_new();
  SECTIONS.forEach(s => {
    const rows = [['Локер', 'Місце', 'Посада', "Прізвище Ім'я", 'Дата заселення', 'Місяців зайнято', 'Статус локера']];
    DATA[s.id].forEach(locker => {
      const status = lockerStatus(locker);
      const statusLabel = status==='empty' ? 'Порожній' : status==='full' ? 'Зайнятий повністю' : 'Частково зайнятий';
      locker.slots.forEach((slot, i) => {
        const m = monthsSince(slot.date);
        rows.push([
          locker.num,
          i+1,
          slot.posada || '',
          slot.name || '',
          slot.date || '',
          slot.name ? (m===null ? '' : m) : '',
          statusLabel
        ]);
      });
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:8},{wch:7},{wch:24},{wch:26},{wch:16},{wch:16},{wch:20}];
    XLSX.utils.book_append_sheet(wb, ws, s.label.slice(0,31));
  });
  const stamp = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `Дракон_Парк_Антей_Локери_${stamp}.xlsx`);
  showToast('⬇ Файл Excel сформовано');
}

// ---------- Toast ----------
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}

// ---------- Events ----------
document.getElementById('backBtn').addEventListener('click', () => {
  showView('home');
  renderHome();
});
document.getElementById('closeModal').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', (e) => {
  if(e.target.id === 'overlay') closeModal();
});
document.getElementById('saveBtn').addEventListener('click', () => {
  currentLockerNumBackup = currentLockerNum;
  saveModal();
});
document.getElementById('clearAllBtn').addEventListener('click', clearLocker);
document.getElementById('exportBtn').addEventListener('click', exportExcel);
document.getElementById('searchInput').addEventListener('input', renderGrid);
document.querySelectorAll('.filter-tab').forEach(tab=>{
  tab.addEventListener('click', () => {
    document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.getAttribute('data-f');
    renderGrid();
  });
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') closeModal();
});

// ---------- Init ----------
(async function init(){
  await loadData();
  renderHome();
})();
</script>
</div><!-- /#appRoot -->
</body>
